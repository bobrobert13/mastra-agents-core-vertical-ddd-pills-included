# Spec 07 §3.3 Tier B — LLM-judge experiments. NEVER a PR merge requirement
# (forks can't false-red on it): schedule + workflow_dispatch + push to main.
# Runs the native experiment pipeline (startExperiment → compareExperiments)
# against the seeded datasets, posts the Δ report to the job summary +
# artifact, and — when `updateBaseline` is on — opens the baseline PR that
# refreshes tests/evals/baseline/eval-baseline.json + recorded fixtures, so
# Tier A's keyless regression reference stays honest (D4 human-gate loop).
name: Evals (live Tier B)

on:
  schedule:
    - cron: '30 03 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run type'
        type: choice
        options: [baseline, compare]
        default: baseline
      candidateModel:
        description: 'MODEL_RESEARCH override for mode=compare (provider/model-id)'
        required: false
        type: string
      updateBaseline:
        description: 'Open baseline-refresh PR to main (nightly default)'
        type: boolean
        default: false
  push:
    branches: [main]

# Same toolchain contract as ci.yml: npm ci + legacy peer deps + lockfile.
env:
  npm_config_legacy_peer_deps: 'true'

permissions:
  contents: write

jobs:
  experiments:
    # Runs on the repo's own events only (schedule/dispatch/push-main). On a
    # fork with no secrets the guarded suites self-skip (hasProviderKey()),
    # so there is nothing to false-red — no owner gate needed (zero-config).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # throwaway eval DB (gitignored via the *.db* entries) — never mastra.db
      EVAL_STORAGE_URL: file:./eval-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - name: Seed native datasets (idempotent)
        run: npm run seed:eval-datasets

      - name: Baseline experiment (records outputs → refreshes Tier A artifacts)
        if: ${{ github.event.inputs.mode == 'baseline' || github.event_name != 'workflow_dispatch' }}
        env:
          EVALS_LIVE_MODE: '1'
          EVALS_LIVE_PHASE: baseline
        run: npx vitest run tests/evals/experiments/live-experiments.test.ts

      - name: Candidate experiment + comparison (dispatch mode=compare)
        if: ${{ github.event.inputs.mode == 'compare' }}
        env:
          MODEL_RESEARCH: ${{ github.event.inputs.candidateModel }}
        run: |
          EVALS_LIVE_MODE=1 EVALS_LIVE_PHASE=candidate npx vitest run tests/evals/experiments/live-experiments.test.ts
          EVALS_LIVE_MODE=1 EVALS_LIVE_PHASE=compare    npx vitest run tests/evals/experiments/live-experiments.test.ts

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-experiments-${{ github.run_id }}
          path: |
            .eval-live/
            coverage/coverage-summary.json

      - name: Open baseline-refresh PR
        if: ${{ github.event.inputs.updateBaseline || (github.event_name == 'schedule' && github.event.inputs.updateBaseline != 'false') }}
        run: |
          if git diff --quiet -- tests/evals/baseline tests/evals/fixtures; then
            echo "No baseline drift — skipping PR"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/eval-baseline-refresh-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add tests/evals/baseline/eval-baseline.json tests/evals/fixtures/
          git commit -m "chore(evals): refresh Tier A baseline from live run ${GITHUB_RUN_ID}"
          git push origin "$BRANCH"
          gh pr create --title "chore(evals): refresh Tier A baseline (run ${GITHUB_RUN_ID})" \
            --body "Auto-generated by evals-live.yml. Review = the human gate on judge-drift (spec 07 D4). Merge to move Tier A's regression reference forward." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
