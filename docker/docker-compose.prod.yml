version: '3.8'

# Shared environment for every process built on the composition root
# (storage/observability/pubsub all read these). MASTRA_JWT_SECRET is a
# cross-spec (01) passthrough: 01's production fail-fast kills EVERY process
# sharing the composition root — workers included; they serve no client
# routes, so auth config there is harmless.
x-mastra-env: &mastra-env
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MASTRA_JWT_SECRET: ${MASTRA_JWT_SECRET:-}

# Worker role: same runner, worker artifact, role selected via MASTRA_WORKERS.
x-worker: &worker
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      MASTRA_OUTPUT: .mastra/worker

# Model/API keys passed through to workers — they execute agent-backed steps.
x-model-env: &model-env
  DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  MODEL: ${MODEL:-}
  OBSERVATIONAL_MEMORY_MODEL: ${OBSERVATIONAL_MEMORY_MODEL:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - mastra-network

  redis:
    image: redis:7-alpine # >= 7.0 required by RedisStreamsPubSub (xAutoClaim reclaim)
    command: ["redis-server", "--appendonly", "yes"] # unacked events must survive redis restart (crash recovery)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # deliberately NO ports: 6379 is never host-exposed
    networks:
      - mastra-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: [*mastra-env, *model-env]
      MASTRA_WORKERS: "false"
      MASTRA_WORKER_AUTH_TOKEN: ${MASTRA_WORKER_AUTH_TOKEN:-} # passthrough; consumed by Spec 01 auth
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
    ports:
      - "4111:4111"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node:22-alpine has no curl — a curl test would never pass and every
      # worker `depends_on: api service_healthy` would hang forever.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4111/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3 # now actually meaningful: signals/resumable streams fan out over Redis
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - mastra-network

  orchestration:
    <<: *worker
    environment:
      <<: [*mastra-env, *model-env]
      MASTRA_WORKERS: orchestration
      MASTRA_STEP_EXECUTION_URL: http://api:4111/api # step dispatch hops back to the API
      MASTRA_WORKER_AUTH_TOKEN: ${MASTRA_WORKER_AUTH_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2 # PubSub consumer groups distribute work across replicas
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - mastra-network

  scheduler:
    <<: *worker
    environment:
      <<: *mastra-env
      MASTRA_WORKERS: scheduler
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1 # NEVER scale: multiple schedulers = duplicate fires per cron tick
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - mastra-network

  background-tasks:
    <<: *worker
    environment:
      <<: [*mastra-env, *model-env]
      MASTRA_WORKERS: backgroundTasks # invalid "background" would WARN-and-serve-nothing
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - mastra-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mastra-network:
    driver: bridge
